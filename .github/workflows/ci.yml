name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Unit tests and regeneration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Every number, the table and the RLE files regenerate from data/
        run: |
          cd paper && python datos_nota.py
          git diff --exit-code -- cifras.tex tabla_censo.tex p10.rle p32.rle
      - name: The spaceships regenerate from their RLE files
        run: |
          cd code && python naves.py && python lean_naves.py
          git diff --exit-code -- ../data/spaceships.json ../lean/Spaceships.lean
      - name: The 5x5 object analysis regenerates from the census data
        run: |
          cd code && python fases_5x5.py
          git diff --exit-code -- ../data/fases-b37-5x5.json ../data/fases-b3-s23-5x5.json

  latex:
    name: The note compiles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: xu-cheng/latex-action@v3
        with:
          root_file: nota.tex
          working_directory: paper

  lean:
    name: Lean proofs and axiom audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean/proofs
          use-mathlib-cache: true
          build: true
          test: false
          lint: false
      - name: Only propext, in all four proofs
        working-directory: lean/proofs
        run: |
          lake env lean ../check_axioms.lean | tee axioms.txt
          test "$(grep -c "depends on axioms: \[propext\]" axioms.txt)" -eq 4
          ! grep -E "sorryAx|ofReduceBool|Lax834858\.Oscillators\.p" axioms.txt
      - name: Still lifes theorem (core Lean, no imports) and its axioms
        working-directory: lean/proofs
        run: |
          lake env lean ../StillLifes.lean | tee still.txt
          grep -q "finite_stillLife_iff' depends on axioms: \[propext, Classical.choice, Quot.sound\]" still.txt
          grep -q "local_dense' does not depend on any axioms" still.txt
          grep -q "local_dead' does not depend on any axioms" still.txt
          grep -q "rule_finite_stillLife_iff' depends on axioms: \[propext, Classical.choice, Quot.sound\]" still.txt
          grep -q "rule_stillLife_iff_of_no_dense_survival' depends on axioms: \[propext, Classical.choice, Quot.sound\]" still.txt
          grep -q "rule_plane_counterexample' depends on axioms: \[propext\]" still.txt
          ! grep -E "sorryAx|ofReduceBool" still.txt
      - name: The c/5 spaceship (core Lean, no imports) and its axioms
        working-directory: lean/proofs
        run: |
          lake env lean ../Spaceships.lean | tee ships.txt
          test "$(grep -c "depends on axioms: \[propext, Classical.choice, Quot.sound\]" ships.txt)" -eq 4
          ! grep -E "sorryAx|ofReduceBool" ships.txt
