name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Unit tests and regeneration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Every number, the table and the RLE files regenerate from data/
        run: |
          cd paper && python datos_nota.py
          git diff --exit-code -- cifras.tex tabla_censo.tex p10.rle p32.rle

  latex:
    name: The note compiles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: xu-cheng/latex-action@v3
        with:
          root_file: nota.tex
          working_directory: paper

  lean:
    name: Lean proofs and axiom audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean/proofs
          use-mathlib-cache: true
          build: true
          test: false
          lint: false
      - name: Only propext, in all four proofs
        working-directory: lean/proofs
        run: |
          lake env lean ../check_axioms.lean | tee axioms.txt
          test "$(grep -c "depends on axioms: \[propext\]" axioms.txt)" -eq 4
          ! grep -E "sorryAx|ofReduceBool|Lax834858\.Oscillators\.p" axioms.txt
